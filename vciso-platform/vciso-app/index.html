<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vCISO Platform</title>
    <script>
      // Pick the theme before anything renders: ?theme=classic|new|dark, else the
      // last choice (localStorage), else 'new'. src/theme/index.js reads this back.
      (function () {
        var themes = ['classic', 'new', 'dark'];
        var theme = null;
        try {
          var fromUrl = new URLSearchParams(location.search).get('theme');
          if (themes.indexOf(fromUrl) > -1) localStorage.setItem('vciso_theme', fromUrl);
          theme = localStorage.getItem('vciso_theme');
        } catch (e) {}
        if (themes.indexOf(theme) < 0) theme = 'new';
        document.documentElement.setAttribute('data-theme', theme);

        // Each theme's own Google Fonts (font axes differ, which changes how headings render)
        var G = 'https://fonts.googleapis.com/css2?family=';
        var fonts = {
          classic: [
            G + 'Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Nunito+Sans:wght@300;400;500;600;700;800;900&family=Source+Serif+4:wght@400;500;600;700&display=swap',
            G + 'Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap'
          ],
          'new': [
            G + 'Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Nunito+Sans:wght@300;400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap'
          ],
          dark: [
            G + 'Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap'
          ]
        };
        fonts[theme].forEach(function (href) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          document.head.appendChild(link);
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind-themes.js"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
