# ==============================================================================
# CyberTrustWorks vCISO Platform - Client Deployment
# Client: Acme Financial Services International Ltd. (Cust_00101)
# Licensed Users: 25 | Max vCISOs: 2
# ==============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vciso_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisSecureDbPassword2026!}
      POSTGRES_DB: vciso_cust_00101
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vciso_pgdata:/var/lib/postgresql/data
      # Turnkey initial schema runs automatically on empty volume:
      - ./001_client_init.sql:/docker-entrypoint-initdb.d/001_client_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vciso_admin -d vciso_cust_00101"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: cybertrustworks/vciso-platform:cust_00101
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ID: Cust_00101
      ENABLED_MODULES: compliance,vulnerabilities,alerting,mobile_access,news_breach_watch,incidents
      DATABASE_URL: postgres://vciso_admin:${POSTGRES_PASSWORD:-ChangeThisSecureDbPassword2026!}@db:5432/vciso_cust_00101
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  vciso_pgdata:
